<!DOCTYPE html>
<html lang="de">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <!-- <meta http-equiv="refresh" content="60" /> -->
  <link rel="stylesheet" href="../styles/frame.css">
  <link rel="stylesheet" href="../styles/responsiveStyle.css">
  <link rel="stylesheet" href="../styles/catering.css">
  <title>Papyrus</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <script src="../scripts/core.js"></script>
  <script src="../scripts/vesperListe.js"></script>
</head>

<body style="height: 100vh;">

  <header class="no-print">
    <div id="hnLogo">
      <a href="https://feuerwehr.heilbronn.de/startseite.html">
        <img src="../img/HN_Logo_mit_Adler_Master_sRGB_w205.png" alt="LogoHN">
      </a>
    </div>
    <div id="papyrus">
      <img id="PapyrusLogo" src="../img/Logo_3.png" alt="Papyrus" style="height: 42px !IMPORTANT;max-height: 42px;">
      <h1 style="text-decoration: none;color: var(--color-text-on-primary);margin: 0;padding: 0;">Papyrus</h1>
    </div>
    <div class="navBar">
      <!-- <a href="catering.html">
        <img src="../img/restaurant.png" alt="Versperliste" class="navLogo">
      </a> -->
      <a href="dashboard.html">
        <img src="../img/hauptmenu.png" alt="Hauptmenü" class="navLogo">
      </a>
      <a href="settings.html" hidden data-auth="required">
        <img src="../img/einstellungen.png" alt="Einstellungen" class="navLogo">
      </a>
      <a href="login.html" hidden data-auth="required" onclick="Dienste.logout(); return false;">
        <img src="../img/ausloggen.png" alt="Logut" class="navLogo">
      </a>
      <a href="login.html" data-auth="guest">
        <img src="../img/einloggen.png" alt="Einloggen" class="navLogo">
      </a>
    </div>
  </header>

  <main class="container" style="width: 100%;">
    <h2>Vesperliste</h2>

    <table class="bestellListe">
      <tr class="tableHead">
        <th>Name</th>
        <th>Nachname</th>
        <th>Bestellung</th>
        <th>Anzahl</th>
      </tr>
      <tr class="tableRow" id="row" style="display: none;">
        <td><input type="text" id="forName"></td>
        <td><input type="text" id="surrName"></td>
        <td><input type="text" id="food"></td>
        <td><input type="number" id="orderCount"></td>
      </tr>
    </table>

    <div class="no-print" id="addTabelRow">
      <img src="../img/plus.png" alt="+">
    </div>
    <div class="sidebarRight no-print" id="print">
      <a>drucken</a>
    </div>
    <div class="sidebarLeft no-print">
      <h2>Menü</h2>
      <ul>
        <li>Brötchen </li>
        <li>Saitenwurst (Paar) </li>
        <li>Rinderwurst (Stück) </li>
        <li>Paprikawurst </li>
        <li>Debreziner </li>
        <li>Weißwurst </li>
        <li>Brezel </li>
        <li>Croissant </li>
        <li>Natur Frischkäse </li>
        <li>Marmelade </li>
        <li>Süßersenf </li>
        <li>Butter </li>
      </ul>
    </div>


  </main>
</body>

<script>
  var addTabelRow = document.getElementById('addTabelRow')
  var printText = document.getElementById('print')

  document.addEventListener("DOMContentLoaded", async () => {
    var assignments = await window.Dienste.loadContent();
    if (!assignments || !assignments.length) return;

    loadShift(assignments)
  });

  addTabelRow.addEventListener("click", () => addNewRow('', ''));
  printText.addEventListener("click", () => print());
</script>

</html>

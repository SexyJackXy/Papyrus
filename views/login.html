<!DOCTYPE html>
<html lang="de">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/responsiveStyle.css">
    <link rel="stylesheet" href="styles/loginStyle.css">
    <title>Papyrus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/settings.js" defer></script>
    <script src="../scripts/login.js" defer></script>
</head>

<body>
  <div id="papyrus">
    <a href="https://de.wikipedia.org/wiki/Pyrotechnik" style="display: contents;">
      <img id="PapyrusLogo" src="../img/Logo.png" alt="Papyrus" style="height: 42px !IMPORTANT;max-height: 42px;">
      <h1 style="text-decoration: none;color: #FFFFFF;margin: 0;padding: 0;">Papyrus</h1>
    </a>
  </div>
  <header>
    <div id="hnLogo">
      <a href="https://feuerwehr.heilbronn.de/startseite.html">
        <img src="../img/HN_Logo_mit_Adler_Master_sRGB_w205.png" alt="LogoHN">
      </a>
    </div>

    <div class="navBar">
      <a class="text" href="dashboard.html" style="padding-right: 0.6rem;">
        <img src="../img/Back.png" alt="zurück" class="navLogo">
      </a>
    </div>
  </header>

    <main class="containerFlex">
        <div class="loginContainer">
            <section class="login" id="loginCard">
                <div id="loginView">
                    <h1 class="loginText">Login</h1>
                    <div class="inputFields">
                        <input type="text" id="username" placeholder="Benutzername" autocomplete="username">

                        <input type="password" id="password" placeholder="Passwort" autocomplete="current-password">

                    </div>
                    <p id="loginError" style="color:#A81309; display:none; font-size:1.5ch; text-align:center;"></p>
                    <div class=" btnLogin">
                        <button id="loginbtn" class="btn" type="button">
                            <p>Einloggen</p>
                        </button>
                    </div>
                    <p class="toggleLink"><a href="#" id="showRegister">Neuen Nutzer anlegen</a></p>
                </div>

                <div id="registerView" style="display:none;">
                    <h1 class="loginText">Registrieren</h1>
                    <div class="inputFields">
                        <input type="text" id="regUsername" placeholder="Benutzername" autocomplete="username">
                        <input type="password" id="regPassword" placeholder="Passwort" autocomplete="new-password">
                        <button id="addNameBtn" class="btn" type="button">
                            <p>+ weiterer Name</p>
                        </button>
                    </div>
                    <p id="registerError" style="color:#A81309; display:none; font-size:1.5ch; text-align:center;"></p>
                    <p id="registerSuccess" style="color:#1a7f37; display:none; font-size:1.5ch; text-align:center;"></p>
                    <div class=" btnLogin">
                        <button id="registerbtn" class="btn" type="button">
                            <p>Nutzer anlegen</p>
                        </button>
                    </div>
                    <p class="toggleLink"><a href="#" id="showLogin">Zurück zum Login</a></p>
                </div>
            </section>

            <section class="loginPicture">
                <img src="../img/GW Rüst FFW HN.png" alt="Login Bild">
            </section>
        </div>
    </main>
</body>

</html>

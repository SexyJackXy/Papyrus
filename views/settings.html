<!DOCTYPE html>
<html lang="de">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>Papyrus</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/settingsStyle.css">
  <link rel="stylesheet" href="styles/responsiveStyle.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <script src="../scripts/core.js"></script>
  <script src="../scripts/settings.js" defer></script>
</head>

<body>
  <header>
    <div id="hnLogo">
      <a href="https://feuerwehr.heilbronn.de/startseite.html" style="width: 165px;">
        <img src="../img/HN_Logo_mit_Adler_Master_sRGB_w205.png" alt="LogoHN">
      </a>
    </div>

    <div id="papyrus">
      <a href="https://de.wikipedia.org/wiki/Pyrotechnik" style="display: contents;">
        <img id="PapyrusLogo" src="../img/Logo.png" alt="Papyrus" style="height: 42px !IMPORTANT;max-height: 42px;">
        <h1 style="text-decoration: none;color: #FFFFFF;margin: 0;padding: 0;">Papyrus</h1>
      </a>
    </div>


    <div class="navBar" style="float: right; width: 265px;">
      <a class="text" style="padding-right: 0.6rem;" href="login.html" onclick="Dienste.logout(); return false;">
        <img src="../img/ausloggen.png" alt="Logut" class="navLogo">
      </a>
      <a class="text" href="settings.html" style="padding-right: 0.6rem;">
        <img src="../img/einstellungen.png" alt="Einstellungen" class="navLogo">
      </a>
      <a class="text" href="index.html" style="padding-right: 0.6rem;">
        <img src="../img/hauptmenu.png" alt="Hauptmenü" class="navLogo">
      </a>
    </div>
  </header>


  <main class="container">
    <div class="buttonspace">
      <input id="inpoutJson" type="file" accept=".json" style="display:none">
      <input id="inputPdf" type="file" accept=".pdf" style="display:none">
      
      <div class="btnSpace">
        <button type="button" class="btn" id="btnUpload">
          <p>PDF Importieren</p>
        </button>
        <a id="pdfResult"></a>
      </div>

      <div class="btnSpace">
        <button id="btnReset" class="btn" type="button">
          <p>Reset</p>
        </button>
        <a id="resetResult"></a>
      </div>
    </div>
    <hr>
    <div class="settingSpace">
      <div class="settingLine">
        <a>Zeige Wachabteilung in Einteilung [WiP]</a>
        <label class="switch">
          <input type="checkbox" id="showWachabteilung">
          <span class="slider"></span>
        </label>
      </div>
      <div class="settingLine">
        <a>Zeige Dienst außer Haus [WiP]</a>
        <label class="switch">
          <input type="checkbox" id="showDuty">
          <span class="slider"></span>
        </label>
      </div>
      <!-- <div class="settingLine">
        <a>Automatischen laden des Tagdienst [WiP]</a>
        <label class="switch">
          <input type="checkbox" id="autoLoadTagdienst">
          <span class="slider"></span>
        </label>
      </div> -->
      <div class="settingLine">
        <a>Arbeitsdienste anzeigen</a>
        <label class="switch">
          <input type="checkbox" id="showArbeitsdienste">
          <span class="slider"></span>
        </label>
      </div>
      <button id="Save" class="btn" type="button">
        <p>Einstellung speichern</p>
      </button>
    </div>
  </main>

  <script>
    var inputJson = document.getElementById('inpoutJson');
    var inputPdf = document.getElementById("inputPdf");
    var btnReset = document.getElementById('btnReset');
    var btnUpload = document.getElementById("btnUpload");
    var resetResult = document.getElementById('resetResult');
    var importResult = document.getElementById('importResult');
    var pdfResult = document.getElementById('pdfResult')

    inputJson.addEventListener('change', (e) => {
      var f = e.target.files[0];
      if (!f) return;

      var res = window.Dienste.readFromFile(f);
      inputJson.value = "";
      jsonResult.textContent = res;
    });

    inputPdf.addEventListener('change', async (e) => {
      var file = inputPdf.files[0];
      var f = e.target.files[0];
      if (!file) return;

      // Datei als Base64 lesen — kein Buffer/Node nötig
      var base64 = await new Promise((resolve, reject) => {
        var reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      var result = await fetch('/api/extract-and-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base64 })
      }).then(r => r.json());

      localStorage.setItem('dienste_csv', JSON.stringify(result.data));
      pdfResult.textContent = "Erfolgreich importiert"
      setTimeout(() => {
        pdfResult.textContent = '';
      }, 2000);

      var p = btnUpload.querySelector("p");
      var originalText = p.textContent;

      p.textContent = "Gespeichert!";
      setTimeout(() => {
        p.textContent = originalText;
      }, 2000);
    });

    btnReset.addEventListener('click', async () => {
      var res = window.Dienste.clearCookies();
      var response = await fetch('/api/reset-schedule', { method: 'POST' });
      var responseTemp = await fetch('/api/reset-temporary-schedule', { method: 'POST' })

      if (!response.ok && !responseTemp.ok) {
        var body = await response.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${response.status}`);
      }

      resetResult.textContent = res;
      setTimeout(() => {
        resetResult.textContent = '';
      }, 2000);
    });

    btnUpload.addEventListener("click", async () => inputPdf.click())
  </script>
</body>

</html>
